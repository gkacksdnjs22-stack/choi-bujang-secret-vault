<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYTE BACK | 로그인 자료실</title><style>
:root{color-scheme:dark;font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--muted:#98a9c2;--line:#26354c;--accent:#9cf0da}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#18313b 0,transparent 48%),#0c1320;color:#e8eef8;min-height:100vh}main{max-width:840px;margin:0 auto;padding:64px 24px 48px}main>p:first-child{font-size:12px;font-weight:750;letter-spacing:.18em;color:var(--accent);margin:0 0 20px}h1{font-size:clamp(32px,6vw,44px);letter-spacing:-.045em;margin:0 0 16px}main>p:not(:first-child){line-height:1.7;color:var(--muted);max-width:560px;margin-bottom:28px}section{background:#121e30;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 16px 48px #0002}#login{max-width:440px}form{display:grid;gap:18px}label{display:block;font-size:13px;font-weight:600;color:#bac8db;line-height:1.5}input,textarea,button{font:inherit;border-radius:10px}input,textarea{display:block;width:100%;margin:8px 0 0;padding:13px 14px;background:#0c1625;border:1px solid #304059;color:#edf4ff;outline:none;transition:border-color .15s,box-shadow .15s}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #9cf0da13}textarea{resize:vertical;min-height:96px;line-height:1.6}button{padding:12px 18px;border:1px solid #526878;background:var(--accent);color:#102b2c;font-weight:700;cursor:pointer;transition:filter .15s,transform .15s}button:hover{filter:brightness(1.08)}button:active{transform:translateY(1px)}#loginForm>button,#newNote>button{margin-top:4px}#status{font-size:14px;color:var(--accent);min-height:22px;margin:20px 0;white-space:pre-wrap}#workspace{position:relative}#account{margin:0 0 30px;color:var(--accent);font-size:13px;font-weight:650}#logout{position:absolute;right:28px;top:18px;background:transparent;border-color:var(--line);color:#b9c6d8;font-size:12px;padding:8px 12px}#newNote{padding-bottom:26px;border-bottom:1px solid var(--line)}#newNote>button{justify-self:start}#notes{display:grid;gap:16px;margin-top:24px}article{background:#0e1929;border:1px solid var(--line);padding:20px;border-radius:14px;display:flex;flex-wrap:wrap;gap:10px}article input,article textarea{margin:0}article input{font-weight:650}article textarea{margin:2px 0 8px}article button{font-size:13px;padding:9px 15px}article button:last-child{background:transparent;color:#f2a5ac;border-color:#603c47}small{display:block;font-size:12px;color:#7e91ad;line-height:1.8;margin-top:28px;max-width:690px}[hidden]{display:none!important}@media(max-width:540px){main{padding:36px 18px}section{padding:22px;border-radius:16px}#logout{right:22px}article{padding:16px}}
</style></head><body><main><p>BYTE BACK · 3단계</p><h1>로그인 자료실</h1><p>가상 자료만 사용하세요. 로그인 후 내 메모를 추가·수정·삭제할 수 있습니다.</p><section id="login"><form id="loginForm"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section><p id="status" role="status"></p><section id="workspace" hidden><p id="account"></p><button id="logout">로그아웃</button><form id="newNote"><label>제목<input id="title" maxlength="200" required></label><label>본문<textarea id="body" maxlength="10000" required></textarea></label><button>메모 추가</button></form><div id="notes"></div></section><small>과거 공개 커밋·배포는 남아 있습니다. 다른 사용자의 메모 ID에 대한 소유자 검사는 다음 단계에서 추가합니다.</small></main><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2';
const auth=createClient('https://mhcjrsyvngiokcoljeet.supabase.co','sb_publishable_PbVmslCPDL1I4fei6avE8Q_wWDTOHv-');
const $=id=>document.getElementById(id); let session=null;
const message=text=>{$('status').textContent=text};
async function api(path='',method='GET',body){const r=await fetch('/api/notes'+path,{method,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'요청 실패');return data}
async function load(){try{const notes=await api();$('notes').replaceChildren(...notes.map(note=>{const card=document.createElement('article'),title=document.createElement('input'),body=document.createElement('textarea'),save=document.createElement('button'),remove=document.createElement('button');title.value=note.title;title.setAttribute('aria-label','메모 제목');body.value=note.body;body.setAttribute('aria-label','메모 본문');save.textContent='수정';remove.textContent='삭제';save.onclick=async()=>{try{await api('/'+note.id,'PUT',{title:title.value,body:body.value});message('수정했습니다.')}catch(e){message(e.message)}};remove.onclick=async()=>{try{await api('/'+note.id,'DELETE');await load();message('삭제했습니다.')}catch(e){message(e.message)}};card.append(title,body,save,remove);return card}));if(!notes.length)message('아직 내 메모가 없습니다. 가상 메모를 추가해 주세요.')}catch(e){message(e.message)}}
async function render(next){session=next;$('login').hidden=!!session;$('workspace').hidden=!session;$('notes').replaceChildren();if(session){$('account').textContent='로그인 완료';await load()}else{message('로그인 후 자료를 볼 수 있습니다.')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();const {data,error}=await auth.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)message(error.message);else await render(data.session)};
$('logout').onclick=async()=>{const {error}=await auth.auth.signOut();if(error)message(error.message);else await render(null)};
$('newNote').onsubmit=async e=>{e.preventDefault();try{await api('','POST',{title:$('title').value,body:$('body').value});$('newNote').reset();await load();message('추가했습니다.')}catch(e){message(e.message)}};
auth.auth.onAuthStateChange((_event,next)=>{setTimeout(()=>render(next),0)});const {data}=await auth.auth.getSession();await render(data.session);
</script></body></html>
