<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYTE BACK | 로그인 자료실</title><style>
:root{color-scheme:light;font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--muted:#647b92;--line:#dbe8f2;--accent:#b9e5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#dff3ff 0,transparent 52%),#f7fbff;color:#18344b;min-height:100vh}main{max-width:840px;margin:0 auto;padding:64px 24px 48px}main>p:first-child{font-size:12px;font-weight:750;letter-spacing:.18em;color:#2585ba;margin:0 0 20px}h1{font-size:clamp(32px,6vw,44px);letter-spacing:-.045em;margin:0 0 16px}main>p:not(:first-child){line-height:1.7;color:var(--muted);max-width:560px;margin-bottom:28px}section{background:#ffffff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 16px 48px #356c9910}#login{max-width:440px}form{display:grid;gap:18px}label{display:block;font-size:13px;font-weight:600;color:#506d85;line-height:1.5}input,textarea,button{font:inherit;border-radius:10px}input,textarea{display:block;width:100%;margin:8px 0 0;padding:13px 14px;background:#f7fbff;border:1px solid #ccdfea;color:#18344b;outline:none;transition:border-color .15s,box-shadow .15s}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6bc7ff26}textarea{resize:vertical;min-height:96px;line-height:1.6}button{padding:12px 18px;border:1px solid #86c9f1;background:var(--accent);color:#17466b;font-weight:700;cursor:pointer;transition:filter .15s,transform .15s}button:hover{filter:brightness(1.08)}button:active{transform:translateY(1px)}#loginForm>button,#newNote>button{margin-top:4px}#status{font-size:14px;color:#2077a9;min-height:22px;margin:20px 0;white-space:pre-wrap}#workspace{position:relative}#account{margin:0 0 30px;color:#2077a9;font-size:13px;font-weight:650}#logout{position:absolute;right:28px;top:18px;background:transparent;border-color:var(--line);color:#55738c;font-size:12px;padding:8px 12px}#newNote{padding-bottom:26px;border-bottom:1px solid var(--line)}#newNote>button{justify-self:start}#notes{display:grid;gap:16px;margin-top:24px}article{background:#ffffff;border:1px solid var(--line);padding:20px;border-radius:14px;display:flex;flex-wrap:wrap;gap:10px}article input,article textarea{margin:0}article input{font-weight:650}article textarea{margin:2px 0 8px}article button{font-size:13px;padding:9px 15px}article button:last-child{background:transparent;color:#c24b63;border-color:#f0d6dd}small{display:block;font-size:12px;color:#6b8297;line-height:1.8;margin-top:28px;max-width:690px}[hidden]{display:none!important}@media(max-width:540px){main{padding:36px 18px}section{padding:22px;border-radius:16px}#logout{right:22px}article{padding:16px}}
.note-card{display:block;padding:0;overflow:hidden}.note-row{display:flex;align-items:center;gap:8px;padding:14px 16px}.note-card .note-title{flex:1;min-width:0;text-align:left;background:transparent;border:0;color:#18344b;font-size:16px;padding:10px 4px;overflow-wrap:anywhere}.note-title:after{content:'⌄';margin-left:12px;color:var(--muted)}.note-title[aria-expanded=true]:after{content:'⌃'}.note-card .note-edit,.note-card .note-cancel{background:transparent;color:#506d85;border-color:var(--line)}.note-card .note-delete{background:transparent;color:#c24b63;border-color:#f0d6dd}.note-detail{padding:0 20px 20px}.note-body{white-space:pre-wrap;overflow-wrap:anywhere;color:#516d85;line-height:1.8;font-size:15px;margin:0;padding-top:16px;border-top:1px solid var(--line)}.note-editor{padding:0 20px 20px}.note-actions{display:flex;gap:8px}.note-card .note-actions button:first-child{background:var(--accent);color:#17466b}.note-title:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:540px){.note-row{padding:10px;gap:5px}.note-card .note-edit,.note-card .note-delete{padding:8px 10px}}</style></head><body><main><p>BYTE BACK · 3단계</p><h1>로그인 자료실</h1><p>가상 자료만 사용하세요. 로그인 후 내 메모를 추가·수정·삭제할 수 있습니다.</p><section id="login"><form id="loginForm"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section><p id="status" role="status"></p><section id="workspace" hidden><p id="account"></p><button id="logout">로그아웃</button><form id="newNote"><label>제목<input id="title" maxlength="200" required></label><label>본문<textarea id="body" maxlength="10000" required></textarea></label><button>메모 추가</button></form><div id="notes"></div></section><small>과거 공개 커밋·배포는 남아 있습니다. 다른 사용자의 메모 ID에 대한 소유자 검사는 다음 단계에서 추가합니다.</small></main><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2';
const auth=createClient('https://mhcjrsyvngiokcoljeet.supabase.co','sb_publishable_PbVmslCPDL1I4fei6avE8Q_wWDTOHv-');
const $=id=>document.getElementById(id); let session=null;
const message=text=>{$('status').textContent=text};
async function api(path='',method='GET',body){const r=await fetch('/api/notes'+path,{method,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'요청 실패');return data}
function noteCard(note) {
  const card=document.createElement('article');
  card.className='note-card';
  const row=document.createElement('div'); row.className='note-row';
  const heading=document.createElement('button'); heading.className='note-title'; heading.textContent=note.title;
  const detail=document.createElement('div'); detail.className='note-detail'; detail.id='note-'+note.id; detail.hidden=true;
  heading.setAttribute('aria-expanded','false'); heading.setAttribute('aria-controls',detail.id);
  const text=document.createElement('p'); text.className='note-body'; text.textContent=note.body;
  const edit=document.createElement('button'); edit.textContent='수정'; edit.className='note-edit';
  const remove=document.createElement('button'); remove.textContent='삭제'; remove.className='note-delete';
  heading.onclick=()=>{detail.hidden=!detail.hidden;heading.setAttribute('aria-expanded',String(!detail.hidden));};
  const form=document.createElement('form'); form.className='note-editor'; form.hidden=true;
  const title=document.createElement('input'); title.value=note.title; title.required=true; title.maxLength=200; title.setAttribute('aria-label','메모 제목');
  const body=document.createElement('textarea'); body.value=note.body; body.required=true; body.maxLength=10000; body.setAttribute('aria-label','메모 본문');
  const actions=document.createElement('div'); actions.className='note-actions';
  const save=document.createElement('button'); save.textContent='저장';
  const cancel=document.createElement('button'); cancel.textContent='취소'; cancel.type='button'; cancel.className='note-cancel';
  const finish=()=>{form.hidden=true;heading.hidden=false;edit.hidden=false;remove.hidden=false;};
  edit.onclick=()=>{title.value=note.title;body.value=note.body;detail.hidden=true;heading.setAttribute('aria-expanded','false');form.hidden=false;heading.hidden=true;edit.hidden=true;remove.hidden=true;title.focus();};
  cancel.onclick=finish;
  form.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{await api('/'+note.id,'PUT',{title:title.value,body:body.value});note.title=title.value;note.body=body.value;heading.textContent=note.title;text.textContent=note.body;finish();message('수정했습니다.');}catch(e){message(e.message)}finally{save.disabled=false}};
  remove.onclick=async()=>{try{await api('/'+note.id,'DELETE');await load();message('삭제했습니다.')}catch(e){message(e.message)}};
  actions.append(save,cancel);form.append(title,body,actions);row.append(heading,edit,remove);detail.append(text);card.append(row,detail,form);return card;
}
async function load(){try{const notes=await api();$('notes').replaceChildren(...notes.map(noteCard));if(!notes.length)message('아직 내 메모가 없습니다. 가상 메모를 추가해 주세요.')}catch(e){message(e.message)}}
async function render(next){session=next;$('login').hidden=!!session;$('workspace').hidden=!session;$('notes').replaceChildren();if(session){$('account').textContent='로그인 완료';await load()}else{message('로그인 후 자료를 볼 수 있습니다.')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();const {data,error}=await auth.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)message(error.message);else await render(data.session)};
$('logout').onclick=async()=>{const {error}=await auth.auth.signOut();if(error)message(error.message);else await render(null)};
$('newNote').onsubmit=async e=>{e.preventDefault();try{await api('','POST',{title:$('title').value,body:$('body').value});$('newNote').reset();await load();message('추가했습니다.')}catch(e){message(e.message)}};
auth.auth.onAuthStateChange((_event,next)=>{setTimeout(()=>render(next),0)});const {data}=await auth.auth.getSession();await render(data.session);
</script></body></html>
